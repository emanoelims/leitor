[tools]
erlang = "29"
elixir = "1.20.4-otp-29"

[env]
PORT = { default = "8080" }

[tasks.setup]
description = "Set up dependencies, database, and assets"
run = ["mix local.hex --force", "mix local.rebar --force", "mix setup"]

[tasks.dev]
description = "Start the Phoenix server"
run = "mix phx.server"

[tasks.precommit]
description = "Check compilation, dependencies, formatting, Credo, Doctor, docs, Dialyzer, and tests"
run = "mix precommit"

[tasks."mcp:register"]
description = "Register Tidewave globally in Codex using the effective mise port"
run = 'codex mcp add tidewave --url "http://localhost:${PORT}/tidewave/mcp"'
